name: Build KmLingual APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Accept Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/20.0/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          yes | sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Scaffold KmLingual Android Project
        run: |
          rm -rf app .github/scripts
          mkdir -p app/src/main/java/com/km/lingual
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KmLingual"
          include ':app'
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=false
          kotlin.code.style=official
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.km.lingual'
              compileSdk 34

              defaultConfig {
                  applicationId "com.km.lingual"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
                  debug {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildFeatures {
                  viewBinding true
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          # Add project specific ProGuard rules here.
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#38BDF8"
                  android:pathData="M28,32h52v44h-52z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/xml/network_security_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">KmLingual</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.KmLingual" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="colorPrimary">#0284C7</item>
                  <item name="colorSecondary">#0D9488</item>
                  <item name="android:windowBackground">#0B1120</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.KmLingual">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0B1120"
              android:padding="14dp">

              <!-- Top Tutor Bar + Settings Button -->
              <LinearLayout
                  android:id="@+id/topBar"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:gravity="center_vertical"
                  android:orientation="horizontal"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent">

                  <LinearLayout
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:orientation="vertical">

                      <TextView
                          android:id="@+id/tvTutorHeader"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="KmLingual Tutor"
                          android:textColor="#F8FAFC"
                          android:textSize="20sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvActiveLangPart"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Arabic • Part 1: Greetings &amp; Politeness"
                          android:textColor="#38BDF8"
                          android:textSize="12sp" />
                  </LinearLayout>

                  <com.google.android.material.button.MaterialButton
                      android:id="@+id/btnSettings"
                      style="@style/Widget.Material3.Button.TonalButton"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Settings"
                      android:textColor="#E2E8F0"
                      app:backgroundTint="#1E293B" />
              </LinearLayout>

              <!-- Face-to-Face Tutor Card -->
              <com.google.android.material.card.MaterialCardView
                  android:id="@+id/cardTutorStage"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="10dp"
                  app:cardBackgroundColor="#111827"
                  app:cardCornerRadius="16dp"
                  app:strokeColor="#1E293B"
                  app:strokeWidth="1dp"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/topBar">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="14dp">

                      <TextView
                          android:id="@+id/tvTutorQuestion"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Tutor asks: How do you greet someone politely in Arabic?"
                          android:textColor="#F8FAFC"
                          android:textSize="16sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvTargetPhrase"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="8dp"
                          android:text="السَّلَامُ عَلَيْكُمْ"
                          android:textColor="#38BDF8"
                          android:textSize="26sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvPronunciationMeaning"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="2dp"
                          android:text="As-salamu alaykum — Peace be upon you"
                          android:textColor="#CBD5E1"
                          android:textSize="14sp" />

                      <TextView
                          android:id="@+id/tvTutorNote"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:text="Rule: Standard greeting; reply 'Wa alaykum as-salam'."
                          android:textColor="#94A3B8"
                          android:textSize="12sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="10dp"
                          android:orientation="horizontal">

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnTutorAsk"
                              style="@style/Widget.Material3.Button.TonalButton"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Tutor Ask"
                              android:textColor="#F8FAFC"
                              app:backgroundTint="#1E293B" />

                          <Space
                              android:layout_width="6dp"
                              android:layout_height="wrap_content" />

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnRepeatSlow"
                              style="@style/Widget.Material3.Button.TonalButton"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Speak Slow"
                              android:textColor="#F8FAFC"
                              app:backgroundTint="#1E293B" />

                          <Space
                              android:layout_width="6dp"
                              android:layout_height="wrap_content" />

                          <com.google.android.material.button.MaterialButton
                              android:id="@+id/btnNextDrill"
                              style="@style/Widget.Material3.Button"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="Next"
                              app:backgroundTint="#0284C7" />
                      </LinearLayout>
                  </LinearLayout>
              </com.google.android.material.card.MaterialCardView>

              <!-- Live Conversation Transcript -->
              <ScrollView
                  android:id="@+id/svTranscript"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:layout_marginTop="10dp"
                  android:layout_marginBottom="10dp"
                  android:background="#111827"
                  android:padding="12dp"
                  app:layout_constraintBottom_toTopOf="@id/inputBox"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toBottomOf="@id/cardTutorStage">

                  <TextView
                      android:id="@+id/tvConversationLog"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:lineSpacingExtra="4dp"
                      android:text="Tutor: Welcome! I am your face-to-face tutor. Speak your answer or ask any doubt—I will answer and guide you by voice."
                      android:textColor="#E2E8F0"
