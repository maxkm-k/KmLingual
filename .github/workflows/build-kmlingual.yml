          cat << 'EOF' > app/src/main/java/com/km/lingual/MainActivity.kt
          package com.km.lingual

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import com.km.lingual.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var binding: ActivityMainBinding
              private var tts: TextToSpeech? = null
              private var ttsReady = false

              private var selectedLangIndex = 0
              private var currentPack: LanguagePack? = null
              private var currentPartIndex = 0
              private var currentDrillIndex = 0
              private var customRemoteUrl = ""

              private val micPermissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) startVoiceInput()
                  else speakTutorReply("Microphone permission is needed so I can hear you speak.")
              }

              private val speechInputLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK) {
                      val matches = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      val spoken = matches?.firstOrNull()?.trim().orEmpty()
                      if (spoken.isNotEmpty()) {
                          binding.etUserSpeechOrDoubt.setText(spoken)
                          handleUserUtterance(spoken, isExplicitDoubt = false)
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  tts = TextToSpeech(this, this)
                  loadLanguage(PackManager.supportedLanguages[selectedLangIndex], autoAsk = false)

                  binding.btnSettings.setOnClickListener { openSettingsDialog() }

                  binding.btnTutorAsk.setOnClickListener {
                      askCurrentQuestionAloud()
                  }

                  binding.btnRepeatSlow.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      speakTargetLanguage(drill.targetText, 0.72f)
                  }

                  binding.btnNextDrill.setOnClickListener {
                      advanceNextDrill(announce = true)
                  }

                  binding.btnMicSpeak.setOnClickListener {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                          == PackageManager.PERMISSION_GRANTED
                      ) {
                          startVoiceInput()
                      } else {
                          micPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      }
                  }

                  binding.btnSubmitAnswer.setOnClickListener {
                      val input = binding.etUserSpeechOrDoubt.text?.toString()?.trim().orEmpty()
                      if (input.isEmpty()) {
                          speakTutorReply("Please speak or type your answer first, or tap Ask Doubt if you have a question.")
                          return@setOnClickListener
                      }
                      handleUserUtterance(input, isExplicitDoubt = false)
                  }

                  binding.btnAskDoubt.setOnClickListener {
                      val doubt = binding.etUserSpeechOrDoubt.text?.toString()?.trim().orEmpty()
                      if (doubt.isEmpty()) {
                          speakTutorReply("Ask me any doubt about pronunciation, grammar, or words, and I will explain it out loud.")
                          return@setOnClickListener
                      }
                      handleUserUtterance(doubt, isExplicitDoubt = true)
                  }
              }

              private fun openSettingsDialog() {
                  val dialogView = layoutInflater.inflate(R.layout.dialog_settings, null)
                  val spLang = dialogView.findViewById<Spinner>(R.id.spDialogLanguage)
                  val spPart = dialogView.findViewById<Spinner>(R.id.spDialogPart)
                  val etUrl = dialogView.findViewById<EditText>(R.id.etDialogUrl)
                  val tvPackInfo = dialogView.findViewById<TextView>(R.id.tvDialogPackStatus)
                  val btnDownload = dialogView.findViewById<View>(R.id.btnDialogDownload)
                  val btnOffline = dialogView.findViewById<View>(R.id.btnDialogOffline)

                  etUrl.setText(customRemoteUrl)
                  spLang.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      PackManager.supportedLanguages.map { it.label }
                  )
                  spLang.setSelection(selectedLangIndex)

                  fun refreshPartsSpinner(pack: LanguagePack) {
                      spPart.adapter = ArrayAdapter(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          pack.parts.map { it.title }
                      )
                      spPart.setSelection(currentPartIndex.coerceIn(0, (pack.parts.size - 1).coerceAtLeast(0)))
                      val cached = PackManager.hasOfflinePack(this, pack.languageCode)
                      tvPackInfo.text = "Book: ${pack.famousBookTitle}\nOffline cache: ${if (cached) "Saved locally" else "Ready to save"}"
                  }

                  currentPack?.let { refreshPartsSpinner(it) }

                  spLang.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          if (position != selectedLangIndex) {
                              selectedLangIndex = position
                              val opt = PackManager.supportedLanguages[position]
                              loadLanguage(opt, autoAsk = true)
                              currentPack?.let { refreshPartsSpinner(it) }
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  spPart.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          currentPartIndex = position
                          currentDrillIndex = 0
                          renderCurrentDrill()
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  btnDownload.setOnClickListener {
                      val opt = PackManager.supportedLanguages[spLang.selectedItemPosition]
                      selectedLangIndex = spLang.selectedItemPosition
                      customRemoteUrl = etUrl.text?.toString()?.trim().orEmpty()
                      tvPackInfo.text = "Downloading ${opt.label} full curriculum pack..."
                      lifecycleScope.launch {
                          val res = PackManager.downloadAndSavePack(this@MainActivity, opt, customRemoteUrl)
                          res.onSuccess { pack ->
                              currentPack = pack
                              currentPartIndex = 0
                              currentDrillIndex = 0
                              refreshPartsSpinner(pack)
                              renderCurrentDrill()
                              speakTutorReply("Downloaded ${pack.languageName} pack from ${pack.famousBookTitle} for offline use.")
                          }.onFailure { err ->
                              val local = PackManager.loadOfflinePack(this@MainActivity, opt)
                              currentPack = local
                              refreshPartsSpinner(local)
                              speakTutorReply("Using offline pack for ${local.languageName}. ${err.message ?: ""}")
                          }
                      }
                  }

                  btnOffline.setOnClickListener {
                      val opt = PackManager.supportedLanguages[spLang.selectedItemPosition]
                      selectedLangIndex = spLang.selectedItemPosition
                      loadLanguage(opt, autoAsk = false)
                      currentPack?.let { refreshPartsSpinner(it) }
                      speakTutorReply("Loaded offline pack for ${opt.label.substringBefore(" (")}.")
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Tutor Settings & Packs")
                      .setView(dialogView)
                      .setPositiveButton("Done", null)
                      .show()
              }

              private fun loadLanguage(option: LanguageOption, autoAsk: Boolean) {
                  val pack = PackManager.loadOfflinePack(this, option)
                  currentPack = pack
                  currentPartIndex = 0
                  currentDrillIndex = 0
                  renderCurrentDrill()
                  if (autoAsk) {
                      askCurrentQuestionAloud()
                  }
              }

              private fun activePart(): LessonPart? = currentPack?.parts?.getOrNull(currentPartIndex)

              private fun activeDrill(): DrillItem? = activePart()?.drills?.getOrNull(currentDrillIndex)

              private fun renderCurrentDrill() {
                  val pack = currentPack ?: return
                  val part = activePart() ?: return
                  val drill = activeDrill() ?: return

                  binding.tvActiveLangPart.text = "${pack.languageName} • ${part.title}"
                  binding.tvTutorQuestion.text = "Tutor asks: ${drill.tutorQuestion}"
                  binding.tvTargetPhrase.text = drill.targetText
                  binding.tvPronunciationMeaning.text = "${drill.transliteration} — ${drill.meaning}"
                  binding.tvTutorNote.text = "Tip: ${drill.grammarTip}"
              }

              private fun askCurrentQuestionAloud() {
                  val drill = activeDrill() ?: return
                  val prompt = "${drill.tutorQuestion} In ${currentPack?.languageName ?: "the target language"}, we say ${drill.transliteration}."
                  appendLog("Tutor", prompt)
                  speakTutorReply(prompt)
              }

              private fun advanceNextDrill(announce: Boolean) {
                  val pack = currentPack ?: return
                  val drills = activePart()?.drills.orEmpty()
                  if (currentDrillIndex + 1 < drills.size) {
                      currentDrillIndex++
                  } else if (currentPartIndex + 1 < pack.parts.size) {
                      currentPartIndex++
                      currentDrillIndex = 0
                  } else {
                      currentPartIndex = 0
                      currentDrillIndex = 0
                      speakTutorReply("You completed all parts of ${pack.languageName}! Starting Part 1 review.")
                  }
                  renderCurrentDrill()
                  if (announce) {
                      askCurrentQuestionAloud()
                  }
              }

              private fun handleUserUtterance(text: String, isExplicitDoubt: Boolean) {
                  val drill = activeDrill() ?: return
                  appendLog("You", text)

                  val lower = text.lowercase()
                  val looksLikeDoubt = isExplicitDoubt ||
                      lower.startsWith("why ") || lower.startsWith("how ") ||
                      lower.startsWith("what ") || lower.contains("doubt") ||
                      lower.contains("explain") || lower.contains("mean") ||
                      lower.contains("difference") || lower.contains("pronounce")

                  if (looksLikeDoubt) {
                      // Answer the learner's doubt by voice and stay on current drill (do NOT advance lesson)
                      val explanation = when {
                          lower.contains("pronounce") || lower.contains("speak") || lower.contains("sound") ->
                              "For ${drill.meaning}, pronounce it as ${drill.transliteration}. ${drill.grammarTip}"
                          lower.contains("mean") || lower.contains("meaning") ->
                              "${drill.transliteration} means: ${drill.meaning}. ${drill.grammarTip}"
                          else ->
                              "Here is your answer: ${drill.grammarTip} The phrase ${drill.transliteration} means ${drill.meaning}."
                      }
                      appendLog("Tutor (Doubt Answer)", explanation)
                      speakTutorReply(explanation)
                      return
                  }

                  val isCorrect = drill.expectedKeywords.any { kw -> lower.contains(kw.lowercase()) } ||
                      lower.contains(drill.transliteration.lowercase().take(5).trim())

                  if (isCorrect) {
                      val praise = "Well done! ${drill.transliteration} means ${drill.meaning}. Let's move to the next step."
                      appendLog("Tutor", praise)
                      speakTutorReply(praise)
                      advanceNextDrill(announce = true)
                  } else {
                      val correction = "Not quite. Listen carefully: for '${drill.tutorQuestion}', the right phrase is ${drill.transliteration}, which means ${drill.meaning}. ${drill.grammarTip} Try saying ${drill.transliteration} again."
                      appendLog("Tutor (Correction)", correction)
                      speakTutorReply(correction)
                  }
              }

              private fun appendLog(speaker: String, message: String) {
                  val prev = binding.tvConversationLog.text?.toString().orEmpty()
                  binding.tvConversationLog.text = "$prev\n\n$speaker: $message"
                  binding.svTranscript.post {
                      binding.svTranscript.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun startVoiceInput() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speakTutorReply("Speech recognition is not available on this device. You can type your answer or doubt.")
                      return
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "Speak your answer or ask your tutor...")
                  }
                  speechInputLauncher.launch(intent)
              }

              private fun speakTutorReply(text: String) {
                  if (!ttsReady || text.isBlank()) return
                  tts?.language = Locale.US
                  tts?.setSpeechRate(0.95f)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "tutor_speech")
              }

              private fun speakTargetLanguage(text: String, rate: Float) {
                  if (!ttsReady || text.isBlank()) return
                  val localeTag = currentPack?.localeTag ?: "en-US"
                  tts?.language = Locale.forLanguageTag(localeTag)
                  tts?.setSpeechRate(rate)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "target_speech")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      ttsReady = true
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

