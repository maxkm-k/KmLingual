          cat << 'EOF' > app/src/main/java/com/km/lingual/CurriculumModels.kt
          package com.km.lingual

          data class LanguageOption(
              val code: String,
              val label: String,
              val localeTag: String
          )

          data class DrillItem(
              val targetText: String,
              val transliteration: String,
              val meaning: String,
              val grammarTip: String,
              val tutorPrompt: String
          )

          data class LessonStep(
              val stepNumber: Int,
              val title: String,
              val tutorIntro: String,
              val drills: List<DrillItem>
          )

          data class LanguagePack(
              val languageCode: String,
              val languageName: String,
              val localeTag: String,
              val steps: List<LessonStep>
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/km/lingual/PackManager.kt
          package com.km.lingual

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object PackManager {

              val supportedLanguages = listOf(
                  LanguageOption("ar", "Arabic (العربية)", "ar-SA"),
                  LanguageOption("ta", "Tamil (தமிழ்)", "ta-IN"),
                  LanguageOption("es", "Spanish (Español)", "es-ES"),
                  LanguageOption("fr", "French (Français)", "fr-FR"),
                  LanguageOption("de", "German (Deutsch)", "de-DE"),
                  LanguageOption("ja", "Japanese (日本語)", "ja-JP"),
                  LanguageOption("hi", "Hindi (हिन्दी)", "hi-IN")
              )

              private fun packFile(context: Context, langCode: String): File {
                  val dir = File(context.filesDir, "lingual_packs")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "pack_$langCode.json")
              }

              fun hasOfflinePack(context: Context, langCode: String): Boolean {
                  val f = packFile(context, langCode)
                  return f.exists() && f.length() > 20
              }

              fun loadOfflinePack(context: Context, option: LanguageOption): LanguagePack {
                  val f = packFile(context, option.code)
                  if (f.exists() && f.length() > 20) {
                      return parsePackJson(f.readText(), option)
                  }
                  val generated = buildDeepCurriculumPack(option)
                  f.writeText(packToJson(generated))
                  return generated
              }

              suspend fun downloadAndSavePack(
                  context: Context,
                  option: LanguageOption,
                  customUrlTemplate: String
              ): Result<LanguagePack> = withContext(Dispatchers.IO) {
                  try {
                      val basePack = if (customUrlTemplate.isNotBlank()) {
                          val resolvedUrl = customUrlTemplate.replace("{lang}", option.code)
                          val conn = (URL(resolvedUrl).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 8000
                              readTimeout = 8000
                              requestMethod = "GET"
                          }
                          conn.connect()
                          if (conn.responseCode in 200..299) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              conn.disconnect()
                              parsePackJson(body, option)
                          } else {
                              conn.disconnect()
                              buildDeepCurriculumPack(option)
                          }
                      } else {
                          val conn = (URL("https://raw.githubusercontent.com").openConnection() as HttpURLConnection).apply {
                              connectTimeout = 6000
                              readTimeout = 6000
                              requestMethod = "HEAD"
                          }
                          conn.connect()
                          conn.disconnect()
                          buildDeepCurriculumPack(option)
                      }

                      val targetFile = packFile(context, option.code)
                      targetFile.writeText(packToJson(basePack))
                      Result.success(basePack)
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              private fun packToJson(pack: LanguagePack): String {
                  val root = JSONObject()
                  root.put("languageCode", pack.languageCode)
                  root.put("languageName", pack.languageName)
                  root.put("localeTag", pack.localeTag)
                  val stepsArr = JSONArray()
                  for (step in pack.steps) {
                      val sObj = JSONObject()
                      sObj.put("stepNumber", step.stepNumber)
                      sObj.put("title", step.title)
                      sObj.put("tutorIntro", step.tutorIntro)
                      val drillsArr = JSONArray()
                      for (d in step.drills) {
                          val dObj = JSONObject()
                          dObj.put("targetText", d.targetText)
                          dObj.put("transliteration", d.transliteration)
                          dObj.put("meaning", d.meaning)
                          dObj.put("grammarTip", d.grammarTip)
                          dObj.put("tutorPrompt", d.tutorPrompt)
                          drillsArr.put(dObj)
                      }
                      sObj.put("drills", drillsArr)
                      stepsArr.put(sObj)
                  }
                  root.put("steps", stepsArr)
                  return root.toString(2)
              }

              private fun parsePackJson(jsonText: String, fallbackOption: LanguageOption): LanguagePack {
                  val root = JSONObject(jsonText)
                  val code = root.optString("languageCode", fallbackOption.code)
                  val name = root.optString("languageName", fallbackOption.label)
                  val locale = root.optString("localeTag", fallbackOption.localeTag)
                  val stepsJson = root.optJSONArray("steps") ?: JSONArray()
                  val steps = mutableListOf<LessonStep>()
                  for (i in 0 until stepsJson.length()) {
                      val sObj = stepsJson.getJSONObject(i)
                      val drillsJson = sObj.optJSONArray("drills") ?: JSONArray()
                      val drills = mutableListOf<DrillItem>()
                      for (j in 0 until drillsJson.length()) {
                          val dObj = drillsJson.getJSONObject(j)
                          drills.add(
                              DrillItem(
                                  targetText = dObj.optString("targetText", ""),
                                  transliteration = dObj.optString("transliteration", ""),
                                  meaning = dObj.optString("meaning", ""),
                                  grammarTip = dObj.optString("grammarTip", ""),
                                  tutorPrompt = dObj.optString("tutorPrompt", "Repeat aloud clearly.")
                              )
                          )
                      }
                      steps.add(
                          LessonStep(
                              stepNumber = sObj.optInt("stepNumber", i + 1),
                              title = sObj.optString("title", "Step ${i + 1}"),
                              tutorIntro = sObj.optString("tutorIntro", "Listen closely and repeat."),
                              drills = drills
                          )
                      )
                  }
                  if (steps.isEmpty()) return buildDeepCurriculumPack(fallbackOption)
                  return LanguagePack(code, name, locale, steps)
              }

              private fun buildDeepCurriculumPack(option: LanguageOption): LanguagePack {
                  val langName = option.label.substringBefore(" (")
                  return when (option.code) {
                      "ar" -> LanguagePack(
                          languageCode = "ar",
                          languageName = langName,
                          localeTag = option.localeTag,
                          steps = listOf(
                              LessonStep(
                                  1, "Step 1: Greetings & Politeness",
                                  "Your tutor note: Start by mastering greeting cadence and polite address. Listen to each phrase twice before speaking.",
                                  listOf(
                                      DrillItem("السَّلَامُ عَلَيْكُمْ", "As-salamu alaykum", "Peace be upon you (standard greeting)", "Traditional opening greeting; reply with 'Wa alaykum as-salam'.", "How do you greet someone politely in Arabic?"),
                                      DrillItem("مَرْحَبًا، كَيْفَ حَالُكَ؟", "Marhaban, kayfa haluka?", "Hello, how are you? (to a male)", "Notice '-uka' for masculine singular; '-uki' is used for a female listener.", "Ask a male friend how he is doing."),
                                      DrillItem("شُكْرًا جَزِيلًا", "Shukran jazilan", "Thank you very much", "'Shukran' means thanks; 'jazilan' intensifies it to 'very much'.", "How do you say 'Thank you very much'?")
                                  )
                              ),
                              LessonStep(
                                  2, "Step 2: Core Verbs & Daily Actions",
                                  "Your tutor note: Verbs carry tense and subject markers. Focus on present action patterns.",
                                  listOf(
