          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/km/lingual/CurriculumModels.kt
          package com.km.lingual

          data class LanguageOption(
              val code: String,
              val label: String,
              val localeTag: String,
              val famousBookTitle: String
          )

          data class DrillItem(
              val tutorQuestion: String,
              val targetText: String,
              val transliteration: String,
              val meaning: String,
              val grammarTip: String,
              val doubtVoiceAnswer: String
          )

          data class LessonPart(
              val partNumber: Int,
              val title: String,
              val bookReference: String,
              val tutorIntro: String,
              val drills: List<DrillItem>
          )

          data class LanguagePack(
              val languageCode: String,
              val languageName: String,
              val localeTag: String,
              val famousBookTitle: String,
              val parts: List<LessonPart>
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/km/lingual/PackManager.kt
          package com.km.lingual

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          object PackManager {

              val supportedLanguages = listOf(
                  LanguageOption("ar", "Arabic (العربية)", "ar-SA", "Arabic Tutor (Book 1 & 2)"),
                  LanguageOption("ta", "Tamil (தமிழ்)", "ta-IN", "Spoken & Literary Tamil Foundation"),
                  LanguageOption("es", "Spanish (Español)", "es-ES", "Aula Internacional"),
                  LanguageOption("fr", "French (Français)", "fr-FR", "Grammaire Progressive"),
                  LanguageOption("de", "German (Deutsch)", "de-DE", "Menschen Deutsch"),
                  LanguageOption("ja", "Japanese (日本語)", "ja-JP", "Genki I"),
                  LanguageOption("hi", "Hindi (हिन्दी)", "hi-IN", "Teach Yourself Hindi")
              )

              private fun packFile(context: Context, langCode: String): File {
                  val dir = File(context.filesDir, "lingual_packs")
                  if (!dir.exists()) dir.mkdirs()
                  return File(dir, "pack_${langCode}_v3.json")
              }

              fun hasOfflinePack(context: Context, langCode: String): Boolean {
                  val f = packFile(context, langCode)
                  return f.exists() && f.length() > 30
              }

              fun loadOfflinePack(context: Context, option: LanguageOption): LanguagePack {
                  val f = packFile(context, option.code)
                  if (f.exists() && f.length() > 30) {
                      return parsePackJson(f.readText(), option)
                  }
                  val generated = buildOrderedCurriculumPack(option)
                  f.writeText(packToJson(generated))
                  return generated
              }

              suspend fun downloadAndSavePack(
                  context: Context,
                  option: LanguageOption,
                  customUrlTemplate: String
              ): Result<LanguagePack> = withContext(Dispatchers.IO) {
                  try {
                      val pack = if (customUrlTemplate.isNotBlank()) {
                          val resolvedUrl = customUrlTemplate.replace("{lang}", option.code)
                          val conn = (URL(resolvedUrl).openConnection() as HttpURLConnection).apply {
                              connectTimeout = 8000
                              readTimeout = 8000
                              requestMethod = "GET"
                          }
                          conn.connect()
                          if (conn.responseCode in 200..299) {
                              val body = conn.inputStream.bufferedReader().use { it.readText() }
                              conn.disconnect()
                              parsePackJson(body, option)
                          } else {
                              conn.disconnect()
                              buildOrderedCurriculumPack(option)
                          }
                      } else {
                          val conn = (URL("https://raw.githubusercontent.com").openConnection() as HttpURLConnection).apply {
                              connectTimeout = 6000
                              readTimeout = 6000
                              requestMethod = "HEAD"
                          }
                          conn.connect()
                          conn.disconnect()
                          buildOrderedCurriculumPack(option)
                      }

                      packFile(context, option.code).writeText(packToJson(pack))
                      Result.success(pack)
                  } catch (e: Exception) {
                      Result.failure(e)
                  }
              }

              private fun packToJson(pack: LanguagePack): String {
                  val root = JSONObject().apply {
                      put("languageCode", pack.languageCode)
                      put("languageName", pack.languageName)
                      put("localeTag", pack.localeTag)
                      put("famousBookTitle", pack.famousBookTitle)
                      val partsArr = JSONArray()
                      for (part in pack.parts) {
                          partsArr.put(JSONObject().apply {
                              put("partNumber", part.partNumber)
                              put("title", part.title)
                              put("bookReference", part.bookReference)
                              put("tutorIntro", part.tutorIntro)
                              val drillsArr = JSONArray()
                              for (d in part.drills) {
                                  drillsArr.put(JSONObject().apply {
                                      put("tutorQuestion", d.tutorQuestion)
                                      put("targetText", d.targetText)
                                      put("transliteration", d.transliteration)
                                      put("meaning", d.meaning)
                                      put("grammarTip", d.grammarTip)
                                      put("doubtVoiceAnswer", d.doubtVoiceAnswer)
                                  })
                              }
                              put("drills", drillsArr)
                          })
                      }
                      put("parts", partsArr)
                  }
                  return root.toString(2)
              }

              private fun parsePackJson(jsonText: String, fallback: LanguageOption): LanguagePack {
                  val root = JSONObject(jsonText)
                  val code = root.optString("languageCode", fallback.code)
                  val name = root.optString("languageName", fallback.label.substringBefore(" ("))
                  val locale = root.optString("localeTag", fallback.localeTag)
                  val book = root.optString("famousBookTitle", fallback.famousBookTitle)
                  val partsJson = root.optJSONArray("parts") ?: JSONArray()
                  val parts = mutableListOf<LessonPart>()
                  for (i in 0 until partsJson.length()) {
                      val pObj = partsJson.getJSONObject(i)
                      val drillsJson = pObj.optJSONArray("drills") ?: JSONArray()
                      val drills = mutableListOf<DrillItem>()
                      for (j in 0 until drillsJson.length()) {
                          val dObj = drillsJson.getJSONObject(j)
                          drills.add(
                              DrillItem(
                                  tutorQuestion = dObj.optString("tutorQuestion", "Repeat the target phrase."),
                                  targetText = dObj.optString("targetText", ""),
                                  transliteration = dObj.optString("transliteration", ""),
                                  meaning = dObj.optString("meaning", ""),
                                  grammarTip = dObj.optString("grammarTip", ""),
                                  doubtVoiceAnswer = dObj.optString("doubtVoiceAnswer", "")
                              )
                          )
                      }
                      parts.add(
                          LessonPart(
                              partNumber = pObj.optInt("partNumber", i + 1),
                              title = pObj.optString("title", "Lesson ${i + 1}"),
                              bookReference = pObj.optString("bookReference", book),
                              tutorIntro = pObj.optString("tutorIntro", "Listen closely and repeat."),
                              drills = drills
                          )
                      )
                  }
                  if (parts.isEmpty()) return buildOrderedCurriculumPack(fallback)
                  return LanguagePack(code, name, locale, book, parts)
              }

              fun buildOrderedCurriculumPack(option: LanguageOption): LanguagePack {
                  val langName = option.label.substringBefore(" (")
                  return when (option.code) {
                      "ar" -> LanguagePack(
                          languageCode = "ar",
                          languageName = "Arabic",
                          localeTag = option.localeTag,
                          famousBookTitle = "Arabic Tutor",
                          parts = listOf(
                              LessonPart(
                                  1, "Lesson 1: Greetings & Ism / Harf", "Arabic Tutor • Lesson 1",
                                  "From Arabic Tutor Lesson 1: start with clear greetings and nominal phrases.",
                                  listOf(
                                      DrillItem(
                                          "Listen and repeat the greeting in Arabic.",
                                          "السَّلَامُ عَلَيْكُمْ", "As-salamu alaykum", "Peace be upon you",
                                          "Use 'As-salamu alaykum' to greet; respond with 'Wa alaykum as-salam'.",
                                          "In Arabic Tutor Lesson 1, As-salamu alaykum means peace be upon you. Listen to the Arabic pronunciation and repeat it with full vowels."
                                      ),
                                      DrillItem(
                                          "Listen and ask how a male is doing.",
                                          "كَيْفَ حَالُكَ؟", "Kayfa haluka?", "How are you? (to a male)",
                                          "Ending '-uka' addresses a masculine singular person; '-uki' addresses feminine.",
                                          "Kayfa haluka means how are you to a male. Notice the 'ka' ending at the end of haluka."
                                      ),
                                      DrillItem(
                                          "Listen and express gratitude.",
                                          "شُكْرًا جَزِيلًا", "Shukran jazilan", "Thank you very much",
                                          "'Shukran' means thanks; 'jazilan' adds strong emphasis.",
