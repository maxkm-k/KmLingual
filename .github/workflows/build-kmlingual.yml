          cat << 'EOF' > app/src/main/java/com/km/lingual/MainActivity.kt
          package com.km.lingual

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.EditText
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.lifecycleScope
          import com.km.lingual.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var binding: ActivityMainBinding
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var hasNativeTargetVoice = false

              private var selectedLangIndex = 0
              private var currentPack: LanguagePack? = null
              private var currentPartIndex = 0
              private var currentDrillIndex = 0
              private var customRemoteUrl = ""
              private var voiceModeIsDoubt = false

              private val micPermissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { granted ->
                  if (granted) launchVoiceSession()
                  else speakCoachEnglish("Microphone permission is needed to listen when you speak.")
              }

              private val speechSessionLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { _ ->
                  // Do NOT rely on raw text transcription for Arabic words; respond directly by voice
                  if (voiceModeIsDoubt) {
                      answerCurrentDoubtByVoice()
                  } else {
                      coachPronunciationByVoice()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  tts = TextToSpeech(this, this)
                  loadLanguage(PackManager.supportedLanguages[selectedLangIndex], speakTargetOnLoad = false)

                  binding.btnSettings.setOnClickListener { openSettingsDialog() }

                  binding.btnTutorAsk.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      appendLog("Native Voice", drill.targetText)
                      speakTargetLanguage(drill.targetText, 0.92f)
                  }

                  binding.btnRepeatSlow.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      appendLog("Slow Native Voice", drill.targetText)
                      speakTargetLanguage(drill.targetText, 0.68f)
                  }

                  binding.btnNextDrill.setOnClickListener {
                      advanceNextDrill(speakTarget = true)
                  }

                  binding.btnMicSpeak.setOnClickListener {
                      voiceModeIsDoubt = false
                      requestOrStartVoice()
                  }

                  binding.btnAskDoubt.setOnClickListener {
                      voiceModeIsDoubt = true
                      requestOrStartVoice()
                  }

                  binding.btnCorrectMe.setOnClickListener {
                      coachPronunciationByVoice()
                  }

                  binding.btnGrammarExplain.setOnClickListener {
                      answerCurrentDoubtByVoice()
                  }
              }

              private fun requestOrStartVoice() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      == PackageManager.PERMISSION_GRANTED
                  ) {
                      launchVoiceSession()
                  } else {
                      micPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              private fun launchVoiceSession() {
                  appendLog("You", if (voiceModeIsDoubt) "[Spoke a doubt]" else "[Spoke pronunciation]")
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      if (voiceModeIsDoubt) answerCurrentDoubtByVoice() else coachPronunciationByVoice()
                      return
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_PROMPT, if (voiceModeIsDoubt) "Ask your doubt..." else "Speak the phrase aloud...")
                  }
                  try {
                      speechSessionLauncher.launch(intent)
                  } catch (_: Exception) {
                      if (voiceModeIsDoubt) answerCurrentDoubtByVoice() else coachPronunciationByVoice()
                  }
              }

              private fun coachPronunciationByVoice() {
                  val drill = activeDrill() ?: return
                  val feedback = "Listen to the native pronunciation of ${drill.meaning}. ${drill.grammarTip} Repeat after me."
                  appendLog("Tutor", "$feedback (${drill.transliteration})")
                  speakCoachEnglish(feedback)
                  tts?.playSilentUtterance(400L, TextToSpeech.QUEUE_ADD, "pause_1")
                  speakTargetLanguage(drill.targetText, 0.75f)
              }

              private fun answerCurrentDoubtByVoice() {
                  val drill = activeDrill() ?: return
                  val answer = drill.doubtVoiceAnswer.ifBlank {
                      "${drill.grammarTip} The phrase means ${drill.meaning}."
                  }
                  appendLog("Tutor (Doubt Voice)", answer)
                  speakCoachEnglish(answer)
              }

              private fun openSettingsDialog() {
                  val dialogView = layoutInflater.inflate(R.layout.dialog_settings, null)
                  val spLang = dialogView.findViewById<Spinner>(R.id.spDialogLanguage)
                  val spPart = dialogView.findViewById<Spinner>(R.id.spDialogPart)
                  val etUrl = dialogView.findViewById<EditText>(R.id.etDialogUrl)
                  val tvPackInfo = dialogView.findViewById<TextView>(R.id.tvDialogPackStatus)
                  val btnDownload = dialogView.findViewById<View>(R.id.btnDialogDownload)
                  val btnOffline = dialogView.findViewById<View>(R.id.btnDialogOffline)

                  etUrl.setText(customRemoteUrl)
                  spLang.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      PackManager.supportedLanguages.map { it.label }
                  )
                  spLang.setSelection(selectedLangIndex)

                  fun refreshPartsSpinner(pack: LanguagePack) {
                      spPart.adapter = ArrayAdapter(
                          this,
                          android.R.layout.simple_spinner_dropdown_item,
                          pack.parts.map { it.title }
                      )
                      spPart.setSelection(currentPartIndex.coerceIn(0, (pack.parts.size - 1).coerceAtLeast(0)))
                      val cached = PackManager.hasOfflinePack(this, pack.languageCode)
                      tvPackInfo.text = "Book: ${pack.famousBookTitle}\nOffline pack: ${if (cached) "Saved locally" else "Ready"}"
                  }

                  currentPack?.let { refreshPartsSpinner(it) }

                  spLang.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          if (position != selectedLangIndex) {
                              selectedLangIndex = position
                              val opt = PackManager.supportedLanguages[position]
                              loadLanguage(opt, speakTargetOnLoad = true)
                              currentPack?.let { refreshPartsSpinner(it) }
                          }
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  spPart.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          currentPartIndex = position
                          currentDrillIndex = 0
                          renderCurrentDrill()
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  btnDownload.setOnClickListener {
                      val opt = PackManager.supportedLanguages[spLang.selectedItemPosition]
                      selectedLangIndex = spLang.selectedItemPosition
                      customRemoteUrl = etUrl.text?.toString()?.trim().orEmpty()
                      tvPackInfo.text = "Downloading ${opt.famousBookTitle} pack..."
                      lifecycleScope.launch {
                          val res = PackManager.downloadAndSavePack(this@MainActivity, opt, customRemoteUrl)
                          res.onSuccess { pack ->
                              currentPack = pack
                              currentPartIndex = 0
                              currentDrillIndex = 0
                              refreshPartsSpinner(pack)
                              renderCurrentDrill()
                              speakCoachEnglish("${pack.famousBookTitle} downloaded for ${pack.languageName} and saved offline.")
                          }.onFailure {
                              val local = PackManager.loadOfflinePack(this@MainActivity, opt)
                              currentPack = local
                              refreshPartsSpinner(local)
                              speakCoachEnglish("Using saved offline pack for ${local.languageName}.")
                          }
                      }
                  }

                  btnOffline.setOnClickListener {
                      val opt = PackManager.supportedLanguages[spLang.selectedItemPosition]
                      selectedLangIndex = spLang.selectedItemPosition
                      loadLanguage(opt, speakTargetOnLoad = true)
                      currentPack?.let { refreshPartsSpinner(it) }
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Tutor Settings & Book Packs")
                      .setView(dialogView)
                      .setPositiveButton("Done", null)
                      .show()
              }

              private fun loadLanguage(option: LanguageOption, speakTargetOnLoad: Boolean) {
                  val pack = PackManager.loadOfflinePack(this, option)
                  currentPack = pack
                  currentPartIndex = 0
                  currentDrillIndex = 0
                  renderCurrentDrill()
                  selectNativeVoiceForLanguage(option.localeTag)
                  if (speakTargetOnLoad) {
                      activeDrill()?.let { speakTargetLanguage(it.targetText, 0.9f) }
                  }
              }

              private fun activePart(): LessonPart? = currentPack?.parts?.getOrNull(currentPartIndex)

              private fun activeDrill(): DrillItem? = activePart()?.drills?.getOrNull(currentDrillIndex)

              private fun renderCurrentDrill() {
                  val pack = currentPack ?: return
                  val part = activePart() ?: return
                  val drill = activeDrill() ?: return

                  binding.tvActiveLangPart.text = "${pack.languageName} • ${part.title}"
                  binding.tvTutorQuestion.text = "Tutor: ${drill.tutorQuestion}"
                  binding.tvTargetPhrase.text = drill.targetText
                  binding.tvPronunciationMeaning.text = "${drill.transliteration} — ${drill.meaning}"
                  binding.tvTutorNote.text = "${pack.famousBookTitle}: ${drill.grammarTip}"
              }

              private fun advanceNextDrill(speakTarget: Boolean) {
                  val pack = currentPack ?: return
                  val drills = activePart()?.drills.orEmpty()
                  if (currentDrillIndex + 1 < drills.size) {
                      currentDrillIndex++
                  } else if (currentPartIndex + 1 < pack.parts.size) {
                      currentPartIndex++
                      currentDrillIndex = 0
                  } else {
                      currentPartIndex = 0
                      currentDrillIndex = 0
                  }
                  renderCurrentDrill()
                  activeDrill()?.let { drill ->
                      appendLog("Tutor", "${drill.tutorQuestion} (${drill.meaning})")
                      if (speakTarget) speakTargetLanguage(drill.targetText, 0.9f)
                  }
              }

              private fun appendLog(speaker: String, message: String) {
                  val prev = binding.tvConversationLog.text?.toString().orEmpty()
                  binding.tvConversationLog.text = "$prev\n\n$speaker: $message"
                  binding.svTranscript.post {
                      binding.svTranscript.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun selectNativeVoiceForLanguage(localeTag: String): Boolean {
                  val engine = tts ?: return false
                  if (!ttsReady) return false

                  val targetLocale = Locale.forLanguageTag(localeTag)
                  val langCode = targetLocale.language.lowercase(Locale.ROOT)
                  val voices = engine.voices.orEmpty()

                  // Prefer an Arabic / target-language voice that is already installed locally (not network-only)
                  val matchingVoice: Voice? = voices
                      .filter { v -> v.locale.language.lowercase(Locale.ROOT) == langCode }
                      .sortedWith(
                          compareBy<Voice> { it.isNetworkConnectionRequired }
                              .thenByDescending { it.locale.country.equals(targetLocale.country, ignoreCase = true) }
                      )
                      .firstOrNull()

                  return if (matchingVoice != null) {
                      engine.voice = matchingVoice
                      engine.language = matchingVoice.locale
                      hasNativeTargetVoice = true
                      true
                  } else {
                      val res = engine.setLanguage(targetLocale)
                      hasNativeTargetVoice = (res != TextToSpeech.LANG_MISSING_DATA && res != TextToSpeech.LANG_NOT_SUPPORTED)
                      if (!hasNativeTargetVoice && langCode == "ar") {
                          appendLog(
                              "Tutor Note",
                              "No Arabic TTS voice installed yet. Open Android Settings -> Accessibility / Text-to-speech output -> Google TTS settings -> Install voice data -> Arabic so Arabic sounds truly native."
                          )
                      }
                      hasNativeTargetVoice
                  }
              }

              private fun speakTargetLanguage(text: String, rate: Float) {
                  val engine = tts ?: return
                  if (!ttsReady || text.isBlank()) return
                  val localeTag = currentPack?.localeTag ?: "ar-SA"
                  selectNativeVoiceForLanguage(localeTag)
                  engine.setSpeechRate(rate)
                  engine.speak(text, TextToSpeech.QUEUE_FLUSH, null, "target_native_speech")
              }

              private fun speakCoachEnglish(text: String) {
                  val engine = tts ?: return
                  if (!ttsReady || text.isBlank()) return
                  val englishVoice = engine.voices?.firstOrNull {
                      it.locale.language.equals("en", ignoreCase = true) && !it.isNetworkConnectionRequired
                  }
                  if (englishVoice != null) {
                      engine.voice = englishVoice
                  } else {
                      engine.language = Locale.UK
                  }
                  engine.setSpeechRate(0.95f)
                  engine.speak(text, TextToSpeech.QUEUE_FLUSH, null, "coach_speech")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      ttsReady = true
                      currentPack?.let { selectNativeVoiceForLanguage(it.localeTag) }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

