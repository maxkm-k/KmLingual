                      android:layout_height="wrap_content"
                      android:text="Settings"
                      android:textColor="#E2E8F0"
                      app:backgroundTint="#1E293B" />
              </LinearLayout>

              <!-- Face-to-Face Tutor Lesson Card -->
              <com.google.android.material.card.MaterialCardView
