          cat << 'EOF' > app/src/main/java/com/km/lingual/MainActivity.kt
          package com.km.lingual

          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import com.km.lingual.databinding.ActivityMainBinding
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MainActivity : AppCompatActivity(), TextToSpeech.OnInitListener {

              private lateinit var binding: ActivityMainBinding
              private var tts: TextToSpeech? = null
              private var ttsReady = false

              private var currentPack: LanguagePack? = null
              private var currentStepIndex = 0
              private var currentDrillIndex = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  tts = TextToSpeech(this, this)

                  val langLabels = PackManager.supportedLanguages.map { it.label }
                  binding.spLanguage.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      langLabels
                  )

                  binding.spLanguage.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          val chosen = PackManager.supportedLanguages[position]
                          loadLanguageIntoTutor(chosen, preferOfflineOnly = false)
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  binding.spLesson.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          currentStepIndex = position
                          currentDrillIndex = 0
                          renderCurrentDrill()
                      }

                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  binding.btnDownloadPack.setOnClickListener {
                      val chosen = selectedLanguage()
                      val customUrl = binding.etPackUrlTemplate.text?.toString()?.trim().orEmpty()
                      binding.tvStatus.text = "Downloading ${chosen.label} pack from network..."
                      lifecycleScope.launch {
                          val result = PackManager.downloadAndSavePack(this@MainActivity, chosen, customUrl)
                          result.onSuccess { pack ->
                              currentPack = pack
                              currentStepIndex = 0
                              currentDrillIndex = 0
                              populateLessonsSpinner(pack)
                              renderCurrentDrill()
                              binding.tvStatus.text = "Downloaded & saved ${pack.languageName} pack for offline use."
                              speakInSelectedLanguage("Pack ready for ${pack.languageName}. Let's begin.", 1.0f)
                          }.onFailure { err ->
                              val fallback = PackManager.loadOfflinePack(this@MainActivity, chosen)
                              currentPack = fallback
                              populateLessonsSpinner(fallback)
                              renderCurrentDrill()
                              binding.tvStatus.text = "Network note (${err.message ?: "offline"}) — using saved/local pack for ${chosen.label}."
                          }
                      }
                  }

                  binding.btnOfflineMode.setOnClickListener {
                      val chosen = selectedLanguage()
                      loadLanguageIntoTutor(chosen, preferOfflineOnly = true)
                  }

                  binding.btnSpeakTarget.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      speakInSelectedLanguage(drill.targetText, 1.0f)
                  }

                  binding.btnSpeakSlow.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      speakInSelectedLanguage(drill.targetText, 0.72f)
                  }

                  binding.btnPrevItem.setOnClickListener {
                      val pack = currentPack ?: return@setOnClickListener
                      if (currentDrillIndex > 0) {
                          currentDrillIndex--
                      } else if (currentStepIndex > 0) {
                          currentStepIndex--
                          binding.spLesson.setSelection(currentStepIndex)
                          currentDrillIndex = (pack.steps[currentStepIndex].drills.size - 1).coerceAtLeast(0)
                      }
                      renderCurrentDrill()
                  }

                  binding.btnNextItem.setOnClickListener {
                      val pack = currentPack ?: return@setOnClickListener
                      val drillsCount = pack.steps.getOrNull(currentStepIndex)?.drills?.size ?: 0
                      if (currentDrillIndex + 1 < drillsCount) {
                          currentDrillIndex++
                      } else if (currentStepIndex + 1 < pack.steps.size) {
                          currentStepIndex++
                          currentDrillIndex = 0
                          binding.spLesson.setSelection(currentStepIndex)
                      } else {
                          Toast.makeText(this, "Completed all steps in this language pack!", Toast.LENGTH_SHORT).show()
                      }
                      renderCurrentDrill()
                  }

                  binding.btnCheckTutor.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      val attempt = binding.etLearnerAttempt.text?.toString()?.trim().orEmpty()
                      if (attempt.isEmpty()) {
                          binding.tvTutorFeedback.text = "Tutor: Try typing a word, transliteration, or meaning first—then I can guide you!"
                          return@setOnClickListener
                      }
                      val normalizedAttempt = attempt.lowercase()
                      val matchesMeaning = drill.meaning.lowercase().split(" ", ",", "(", ")")
                          .filter { it.length > 3 }
                          .any { normalizedAttempt.contains(it) }
                      val matchesTarget = normalizedAttempt.contains(drill.targetText.lowercase()) ||
                          normalizedAttempt.contains(drill.transliteration.lowercase().take(6))

                      binding.tvTutorFeedback.text = if (matchesMeaning || matchesTarget) {
                          "Tutor: Great work! You captured key elements of '${drill.meaning}'. Now listen and repeat '${drill.targetText}' aloud."
                      } else {
                          "Tutor: Good effort! Target is '${drill.targetText}' (${drill.transliteration}) — meaning: '${drill.meaning}'. Tip: ${drill.grammarTip}"
                      }
                  }

                  binding.btnTutorSpeakCoaching.setOnClickListener {
                      val drill = activeDrill() ?: return@setOnClickListener
                      speakInSelectedLanguage("${drill.targetText}. ${drill.meaning}", 0.9f)
                  }
              }

              private fun selectedLanguage(): LanguageOption {
                  val idx = binding.spLanguage.selectedItemPosition.coerceAtLeast(0)
                  return PackManager.supportedLanguages[idx]
              }

              private fun loadLanguageIntoTutor(option: LanguageOption, preferOfflineOnly: Boolean) {
                  val alreadyStored = PackManager.hasOfflinePack(this, option.code)
                  val pack = PackManager.loadOfflinePack(this, option)
                  currentPack = pack
                  currentStepIndex = 0
                  currentDrillIndex = 0
                  populateLessonsSpinner(pack)
                  renderCurrentDrill()
                  applyTtsLocale(option.localeTag)

                  binding.tvStatus.text = if (alreadyStored) {
                      "Offline ready: ${pack.languageName} pack loaded from local storage."
                  } else if (preferOfflineOnly) {
                      "Offline pack initialized for ${pack.languageName}. Tap 'Download / Sync Pack' anytime to refresh."
                  } else {
                      "Selected ${pack.languageName}. Tap 'Download / Sync Pack' to fetch/update or practice offline now."
                  }
              }

              private fun populateLessonsSpinner(pack: LanguagePack) {
                  val titles = pack.steps.map { it.title }
                  binding.spLesson.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      titles
                  )
                  binding.spLesson.setSelection(currentStepIndex.coerceIn(0, (titles.size - 1).coerceAtLeast(0)))
              }

              private fun activeStep(): LessonStep? = currentPack?.steps?.getOrNull(currentStepIndex)

              private fun activeDrill(): DrillItem? = activeStep()?.drills?.getOrNull(currentDrillIndex)

              private fun renderCurrentDrill() {
                  val step = activeStep() ?: return
                  val drill = activeDrill() ?: return
                  binding.tvTutorGuidance.text = step.tutorIntro
                  binding.tvItemCounter.text = "Step ${step.stepNumber} • Drill ${currentDrillIndex + 1} / ${step.drills.size}"
                  binding.tvTargetScript.text = drill.targetText
                  binding.tvTransliteration.text = "Pronunciation: ${drill.transliteration}"
                  binding.tvMeaning.text = "Meaning: ${drill.meaning}"
                  binding.tvGrammarTip.text = "Deep Tutor Note: ${drill.grammarTip}"
                  binding.tvTutorPrompt.text = "Tutor Prompt: ${drill.tutorPrompt}"
                  binding.tvTutorFeedback.text = "Tutor ready for your attempt on this step."
              }

              private fun applyTtsLocale(localeTag: String) {
                  if (!ttsReady) return
                  val locale = Locale.forLanguageTag(localeTag)
                  val res = tts?.setLanguage(locale)
                  if (res == TextToSpeech.LANG_MISSING_DATA || res == TextToSpeech.LANG_NOT_SUPPORTED) {
                      binding.tvStatus.append(" (Note: Install ${locale.displayLanguage} voice in Android TTS settings for native audio.)")
                  }
              }

              private fun speakInSelectedLanguage(text: String, rate: Float) {
                  if (!ttsReady || text.isBlank()) return
                  val option = selectedLanguage()
                  tts?.setLanguage(Locale.forLanguageTag(option.localeTag))
                  tts?.setSpeechRate(rate)
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "kmlingual_utterance")
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      ttsReady = true
                      applyTtsLocale(selectedLanguage().localeTag)
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload KmLingual APK
        uses: actions/upload-artifact@v4
        with:
          name: KmLingual-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
